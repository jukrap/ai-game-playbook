name: Control plane checks

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "global.json"
      - "tsconfig*.json"
      - "packages/**"
      - "golden/graybox/**"
      - "generated/**"
      - "docs/planned-surface.json"
      - "docs/planned-cli*.md"
      - "test/**"
      - "scripts/**"
      - ".github/workflows/control-plane.yml"
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "global.json"
      - "tsconfig*.json"
      - "packages/**"
      - "golden/graybox/**"
      - "generated/**"
      - "docs/planned-surface.json"
      - "docs/planned-cli*.md"
      - "test/**"
      - "scripts/**"
      - ".github/workflows/control-plane.yml"

permissions:
  contents: read

jobs:
  conformance:
    name: Verify control plane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Enable locked package manager
        run: corepack enable
      - name: Confirm package manager
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify contracts and generated surfaces
        run: pnpm verify
      - name: Audit all dependencies
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit
      - name: Check workspace drift
        run: pnpm run ci:check-clean

  windows-containment:
    name: Verify Windows containment provider
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400
      - name: Enable locked package manager
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify Windows containment
        run: pnpm run provider:windows:verify
      - name: Check workspace drift
        run: pnpm run ci:check-clean
