name: Documentation checks

on:
  pull_request:
    paths:
      - "README*.md"
      - "docs/**"
      - "scripts/check-docs.mjs"
      - ".gitattributes"
      - ".github/workflows/docs.yml"
  push:
    paths:
      - "README*.md"
      - "docs/**"
      - "scripts/check-docs.mjs"
      - ".gitattributes"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    name: Check docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs
